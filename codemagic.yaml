workflows:
  android_debug:
    name: Android Debug
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Create .env from CodeMagic variables
        script: |
          cat > "$CM_BUILD_DIR/.env" <<EOF
          BASE_URL=$BASE_URL
          API_TIMEOUT=${API_TIMEOUT:-30000}
          EOF
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Android APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  ios_release:
    name: iOS Compile Check
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Create .env from CodeMagic variables
        script: |
          cat > "$CM_BUILD_DIR/.env" <<EOF
          BASE_URL=$BASE_URL
          API_TIMEOUT=${API_TIMEOUT:-30000}
          EOF
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
      - name: Compile iOS without codesign
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
